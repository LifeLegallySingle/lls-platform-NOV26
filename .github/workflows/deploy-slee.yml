# Deploys SLEE via GitHub Actions. Use THIS or Cloudflare Workers Builds (docs/SETUP.md) — not both.
# Turn on by setting repository variable SLEE_DEPLOY_VIA_ACTIONS = true.
name: Deploy SLEE
on:
  push:
    branches: [main]
    paths: ["workers/slee/**", ".github/workflows/deploy-slee.yml"]
  workflow_dispatch:
jobs:
  deploy:
    if: vars.SLEE_DEPLOY_VIA_ACTIONS == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workers/slee } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: workers/slee/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply slee --remote
      - name: Deploy Worker
        run: npx wrangler deploy
